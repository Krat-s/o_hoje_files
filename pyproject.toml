[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o-hoje-files"
version = "0.1.0"
description = "Automação de tarefas internas do jornal O HOJE"
requires-python = ">=3.11"
dependencies = [
    "attrs==25.3.0",
    "certifi==2025.8.3",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "comtypes==1.4.12",
    "h11==0.16.0",
    "idna==3.10",
    "keyboard==0.13.5",
    "MouseInfo==0.1.3",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "outcome==1.3.0.post0",
    "packaging==25.0",
    "pillow==11.3.0",
    "PyAutoGUI==0.9.54",
    "pycparser==2.23",
    "PyGetWindow==0.0.9",
    "PyMsgBox==2.0.1",
    "pyperclip==1.11.0",
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
    "PyQt5_sip==12.17.0",
    "PyRect==0.2.0",
    "PyScreeze==1.0.1",
    "PySocks==1.7.1",
    "pytesseract==0.3.13",
    "python-dotenv==1.2.1",
    "pytweening==1.2.0",
    "pywin32==311",
    "pywinauto==0.6.9",
    "requests==2.32.5",
    "schedule==1.2.2",
    "selenium==4.36.0",
    "six==1.17.0",
    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "trio==0.31.0",
    "trio-websocket==0.12.2",
    "typing_extensions==4.15.0",
    "urllib3==2.5.0",
    "webdriver-manager==4.0.2",
    "websocket-client==1.8.0",
    "wsproto==1.2.0",
]

[tool.setuptools.packages.find]
include = ["departments*", "settings*", "shared*"]
exclude = ["tests*", "storage*", "scripts*"]
